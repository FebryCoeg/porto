name: Cek update data NTE

on:
  schedule:
    - cron: "0 1 * * 1" # tiap Senin 08.00 WIB
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: read
  issues: write

concurrency:
  group: nte-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bandingkan dengan NTE_Assets terbaru
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/nte/check_update.py nte-update.md

      - name: Buka atau perbarui Issue pemberitahuan
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
          HEAD_SHA: ${{ steps.check.outputs.head }}
        run: |
          gh label create nte-update --color f97316 --description "Data NTE_Assets punya versi baru" --force
          existing=$(gh issue list --label nte-update --state open --limit 1 --json number,body)
          num=$(echo "$existing" | jq -r '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --label nte-update --body-file nte-update.md
          elif echo "$existing" | jq -r '.[0].body' | grep -q "head:$HEAD_SHA"; then
            echo "Update ini sudah dilaporkan di Issue #$num."
          else
            gh issue edit "$num" --title "$TITLE" --body-file nte-update.md
            gh issue comment "$num" --body "Ada update baru lagi: $TITLE"
          fi
