<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Halaman tidak ditemukan | Febry Coeg</title>
  <script>
    // Link lama: /portfolio/... pindah ke root, halaman NTE pindah ke nteid.site.
    (function () {
      var p = location.pathname, tail = location.search + location.hash;
      if (/^\/portfolio(\/|$)/.test(p)) {
        location.replace((p.replace(/^\/portfolio/, "") || "/") + tail);
        return;
      }
      if (/^\/(nte|esper|arc|modul|item|furnitur|kendaraan|properti|cerita|anomali|istilah|pencapaian|fashion|makanan|tierlist)(\/|$)/.test(p)) {
        location.replace("https://nteid.site" + p + tail);
      }
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #14101c; color: #f4eef9; font-family: system-ui, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: clamp(56px, 14vw, 120px); margin: 0; letter-spacing: -2px; color: #ff9ec7; }
    p { margin: 8px 0 24px; opacity: .8; }
    a { display: inline-block; margin: 4px; padding: 10px 20px; border-radius: 999px; background: #ff9ec7; color: #14101c; font-weight: 700; text-decoration: none; }
    a.alt { background: transparent; color: #f4eef9; border: 2px solid #ff9ec7; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Halaman yang kamu cari tidak ada.</p>
    <a href="/">Ke beranda</a>
    <a class="alt" href="https://nteid.site">Database NTE</a>
  </main>
</body>
</html>
