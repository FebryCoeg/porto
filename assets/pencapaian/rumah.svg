<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="0.6" stop-color="#d9b8f2"/>
      <stop offset="1" stop-color="#ffc2d8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8db7"/>
      <stop offset="1" stop-color="#d94f8a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f1e6f4"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <g id="petal"><path d="M0 0c-9-12-6-27 0-31 6 4 9 19 0 31z"/></g>
    <g id="flower">
      <use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/>
    </g>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <!-- bulan & bintang -->
  <circle cx="810" cy="95" r="42" fill="#fff" opacity="0.9"/>
  <circle cx="828" cy="84" r="40" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.85">
    <circle cx="130" cy="80" r="3"/><circle cx="250" cy="50" r="2.5"/><circle cx="700" cy="60" r="2.5"/><circle cx="600" cy="110" r="2"/><circle cx="380" cy="70" r="2"/>
  </g>
  <!-- awan -->
  <g fill="#fff" opacity="0.75">
    <path d="M110 170a34 34 0 0 1 64-14 26 26 0 0 1 40 22H96a20 20 0 0 1 14-8z"/>
    <path d="M640 190a30 30 0 0 1 56-12 22 22 0 0 1 34 19H626a18 18 0 0 1 14-7z"/>
  </g>
  <!-- bukit -->
  <path d="M0 430 Q240 360 480 410 T960 400 V540 H0z" fill="#b9a7f0" opacity="0.6"/>
  <path d="M0 460 Q300 410 560 450 T960 440 V540 H0z" fill="#8fb4ff" opacity="0.55"/>
  <rect y="470" width="960" height="70" fill="#7f9be8" opacity="0.55"/>
  <!-- pohon sakura -->
  <g transform="translate(205 470)">
    <path d="M-8 0 C-6 -50 -14 -80 -2 -120 M-4 -80 C-24 -95 -36 -105 -48 -128 M-2 -100 C14 -112 26 -122 40 -140" stroke="#7a4a68" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g fill="#ffb3cf">
      <circle cx="-50" cy="-150" r="42"/><circle cx="0" cy="-170" r="50"/><circle cx="46" cy="-150" r="40"/><circle cx="-20" cy="-125" r="36"/><circle cx="26" cy="-118" r="32"/>
    </g>
    <g fill="#fff" opacity="0.6"><use href="#flower" transform="translate(-30 -175) scale(0.45)"/><use href="#flower" transform="translate(30 -150) scale(0.4)"/></g>
  </g>
  <!-- rumah -->
  <g transform="translate(560 470)">
    <ellipse cx="0" cy="4" rx="190" ry="14" fill="#1d2548" opacity="0.15"/>
    <rect x="-150" y="-170" width="300" height="170" rx="10" fill="url(#wall)"/>
    <rect x="70" y="-265" width="38" height="70" rx="6" fill="#e9dcf2"/>
    <path d="M-185 -158 L0 -290 L185 -158 Q190 -150 180 -146 H-180 Q-190 -150 -185 -158z" fill="url(#roof)"/>
    <path d="M-150 -146 H150" stroke="#c43f7a" stroke-width="6" opacity="0.4"/>
    <!-- pintu -->
    <rect x="-34" y="-110" width="68" height="110" rx="30" fill="#8a5d7f"/>
    <circle cx="20" cy="-52" r="5" fill="#ffd27a"/>
    <!-- jendela -->
    <g>
      <rect x="-122" y="-120" width="62" height="58" rx="10" fill="url(#win)"/>
      <path d="M-91 -120 V-62 M-122 -91 H-60" stroke="#fff" stroke-width="5"/>
      <rect x="60" y="-120" width="62" height="58" rx="10" fill="url(#win)"/>
      <path d="M91 -120 V-62 M60 -91 H122" stroke="#fff" stroke-width="5"/>
    </g>
    <!-- jendela bulat di atap -->
    <circle cx="0" cy="-200" r="24" fill="url(#win)"/>
    <path d="M0 -224 V-176 M-24 -200 H24" stroke="#fff" stroke-width="4"/>
    <!-- jalan setapak -->
    <path d="M-34 0 Q-50 40 -80 70 H80 Q50 40 34 0z" fill="#fff" opacity="0.45"/>
  </g>
  <!-- hati di atas rumah -->
  <g transform="translate(560 140)">
    <circle r="40" fill="#fff" opacity="0.35"/>
    <path d="M0 22s-30-17-30-38a16 16 0 0 1 30-9 16 16 0 0 1 30 9c0 21-30 38-30 38z" fill="#ff5f9e"/>
  </g>
  <!-- kelopak berjatuhan -->
  <g fill="#fff" opacity="0.7">
    <use href="#petal" transform="translate(330 230) rotate(40) scale(0.5)"/>
    <use href="#petal" transform="translate(420 320) rotate(-30) scale(0.45)"/>
    <use href="#petal" transform="translate(760 300) rotate(70) scale(0.5)"/>
    <use href="#petal" transform="translate(860 250) rotate(10) scale(0.4)"/>
  </g>
</svg>
